<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<title>الفحص — منصة التدريس</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23002856%27/%3E%3Crect x=%273%27 y=%273%27 width=%2726%27 height=%2726%27 fill=%27none%27 stroke=%27%230DABE2%27 stroke-width=%271.5%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27%23F8D81B%27 font-family=%27serif%27%3E%D9%88%3C/text%3E%3C/svg%3E">
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/grades.css">
</head>
<body>

<div id="chrome"></div>

<div id="denied" hidden>
  <div class="warn-box">هذه الصفحة للمشرف التقني. إن كان هذا حسابك،
    فأضيفي معرّفك في جدول <code>owners</code> بدور <code>admin</code>.</div>
</div>

<div id="panel" hidden>

  <div class="control">
    <span class="hint" id="who"></span>
    <span class="spacer"></span>
    <button id="recheck" type="button" class="ghost">أعيدي الفحص</button>
    <button id="backup" type="button" class="ghost">نسخة احتياطية كاملة</button>
    <button id="report" type="button" class="gold">نزّلي تقرير عطل</button>
  </div>

  <div class="section-title">الفحص <span class="sub" id="checkSub"></span></div>
  <ul class="checks" id="checks"></ul>

  <div class="section-title">البيئة</div>
  <div class="wrap"><table class="grid" id="env"></table></div>

  <div class="section-title">حجم البيانات</div>
  <div class="wrap"><table class="grid" id="sizes"></table></div>

  <div class="section-title">أخطاء هذه الجلسة <span class="sub" id="errSub"></span></div>
  <div class="wrap"><table class="grid" id="errors"></table></div>
  <div id="errEmpty"></div>

  <div class="section-title">أدوات خطرة</div>
  <div class="item">
    <div class="why">هذه الأزرار تمسّ البيانات. لا تُستعمل إلا بعد نسخة احتياطية.</div>
    <div class="control">
      <button id="restore" type="button" class="ghost">استعادة من ملف</button>
      <input type="file" id="restoreFile" accept=".json" hidden>
      <span class="spacer"></span>
      <button id="wipeTheme" type="button" class="ghost">تصفير الألوان</button>
      <button id="wipe" type="button" class="danger">محو بيانات هذا الجهاز</button>
    </div>
    <div class="join-note" id="dangerState"></div>
  </div>

</div>

<footer class="foot">
  <div>صفحة الفحص — لا تظهر للدكتورة ولا للطالبات.</div>
  <div id="credit"></div>
</footer>

<script src="data/course.js"></script>
<script src="data/worksheets.js"></script>
<script src="data/activities.js"></script>
<script src="assets/config.js"></script>
<script src="assets/adapters/supabase.js"></script>
<script src="assets/store.js"></script>
<script src="assets/role.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
