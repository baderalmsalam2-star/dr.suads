<!DOCTYPE html>

<head>

<!--  ورقةٌ خارجيةٌ لا تحجز الرسم: كانت تُحمَّل حاجزةً، فعلى شبكةٍ
      تبتلع الطلب بلا ردّ — وهي حالُ الحجب الأشيع في الجامعات —
      تقف الطالبة أمام بياضٍ ثمانيَ ثوانٍ. تُحمَّل الآن بلا حجز،
      ويظهر النصُّ بخطّ النظام ثم ينقلب متى وصلت. والمتنُ لا
      ينتظرها أصلًا: Amiri مستضافٌ في assets/fonts. -->

<body>

<div id="chrome"></div>

<div class="control">
  <span class="hint" id="who"></span>
  <span class="spacer"></span>
  <a class="btn" id="sheetsLink" href="worksheets.html">أوراق العمل</a>
  <button id="printBtn" type="button" class="ghost">طباعة الملف</button>
</div>

<div class="profile" id="stats"></div>

<div class="section-title">الدرجات <span class="sub" id="grSub"></span></div>
<div class="wrap"><table class="grid" id="grades"></table></div>

<div class="wrap"><table class="grid" id="events"></table></div>

<ul class="files" id="uploads"></ul>

<footer class="foot">

  <div data-staff hidden>البيانات محفوظة على هذا الجهاز — صدِّري نسخة احتياطية من صفحة الطالبات بين حين وآخر.</div>
  <div id="credit"></div>
