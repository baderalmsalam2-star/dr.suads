<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<title>لوحة الشرف — منصة التدريس</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23002856%27/%3E%3Crect x=%273%27 y=%273%27 width=%2726%27 height=%2726%27 fill=%27none%27 stroke=%27%230DABE2%27 stroke-width=%271.5%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27%23F8D81B%27 font-family=%27serif%27%3E%D9%88%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div id="chrome"></div>

<div class="control">
  <label for="section">الشعبة:</label>
  <select id="section" aria-label="اختيار الشعبة"></select>

  <label for="scope">المدى:</label>
  <select id="scope" aria-label="مدى لوحة الشرف">
    <option value="day">اليوم</option>
    <option value="month">الشهر</option>
    <option value="term">الفصل كاملًا</option>
  </select>

  <input type="date" id="day" aria-label="اليوم">
  <input type="month" id="month" aria-label="الشهر" hidden>

  <span class="spacer"></span>
  <button id="print" type="button" class="ghost">طباعة اللوحة</button>
</div>

<div class="section-title" id="title">لوحة الشرف</div>
<div id="podium" class="podium"></div>

<div class="section-title">الترتيب الكامل <span class="sub" id="sub"></span></div>
<div class="wrap"><table class="grid" id="table"></table></div>
<div id="emptyBox"></div>

<div class="note-box">
  نقاط التفاعل تُرصد أثناء الحصة من لوحة الرصد (مفتاح <b>م</b> داخل العرض)، ومن تسليم أوراق العمل.
  وهي نقاط مشاركة صفّية لا درجات أكاديمية.
</div>

<footer class="foot">
  <div>البيانات محفوظة على هذا الجهاز — صدِّري نسخة احتياطية من صفحة الطالبات بين حين وآخر.</div>
  <div id="credit"></div>
</footer>

<script src="data/course.js"></script>
<script src="data/worksheets.js"></script>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/honors.js"></script>
</body>
</html>
