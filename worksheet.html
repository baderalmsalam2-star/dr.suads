<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<title>ورقة عمل — منصة التدريس</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--  ورقةٌ خارجيةٌ لا تحجز الرسم: كانت تُحمَّل حاجزةً، فعلى شبكةٍ
      تبتلع الطلب بلا ردّ — وهي حالُ الحجب الأشيع في الجامعات —
      تقف الطالبة أمام بياضٍ ثمانيَ ثوانٍ. تُحمَّل الآن بلا حجز،
      ويظهر النصُّ بخطّ النظام ثم ينقلب متى وصلت. والمتنُ لا
      ينتظرها أصلًا: Amiri مستضافٌ في assets/fonts. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap"
      rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23002856%27/%3E%3Crect x=%273%27 y=%273%27 width=%2726%27 height=%2726%27 fill=%27none%27 stroke=%27%230DABE2%27 stroke-width=%271.5%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27%23F8D81B%27 font-family=%27serif%27%3E%D9%88%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="د. سعاد المطوع">
<meta name="theme-color" content="#002856">
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div id="chrome"></div>

<div class="control">
  <label for="student">الطالبة:</label>
  <select id="student" aria-label="اختيار الطالبة"></select>
  <span class="hint" id="state"></span>
  <span class="spacer"></span>
  <button id="save" type="button" class="ghost">حفظ مسودة</button>
  <button id="submit" type="button">تسليم</button>
  <button id="send" type="button" class="gold" hidden>تنزيل ملف التسليم</button>
  <button id="reopen" type="button" class="ghost" hidden>فتح للتعديل</button>
  <button id="printBtn" type="button" class="ghost">طباعة</button>
  <!-- لا يظهر إلا للدكتورة — يُكشف في worksheet.js بعد سؤال TPRole -->
  <button id="editText" type="button" class="ghost" hidden>تحرير النصوص</button>
</div>

<!-- نافذة التسليم: بيانٌ للجميع، وضبطٌ للدكتورة وحدها -->
<div id="window" class="win-box" hidden>
  <span class="win-state" id="winState"></span>
  <span class="win-set" id="winSet" hidden>
    <label for="opensAt">يُفتح:</label>
    <input type="datetime-local" id="opensAt">
    <label for="dueAt">آخر موعد:</label>
    <input type="datetime-local" id="dueAt">
    <button id="winClear" type="button" class="ghost sm">بلا موعد</button>
  </span>
</div>

<div id="intro" class="note-box"></div>
<div id="items"></div>
<div id="emptyBox"></div>

<footer class="foot">
  <!-- أمرٌ يخصّ الدكتورة، وصفحةُ «الطالبات» ليست في شريط الطالبة أصلًا. -->
  <div data-staff hidden>البيانات محفوظة على هذا الجهاز — صدِّري نسخة احتياطية من صفحة الطالبات بين حين وآخر.</div>
  <div id="credit"></div>
</footer>

<script src="data/tenants.js"></script>
<script src="data/courses.js"></script>
<script src="assets/config.js"></script>
<script src="assets/adapters/supabase.js"></script>
<script src="assets/store.js"></script>
<script src="assets/content.js"></script>
<script src="assets/role.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/quiz.js"></script>
<script src="assets/worksheet.js"></script>
</body>
</html>
