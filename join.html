<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<title>تسجيل الطالبة — منصة التدريس</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23002856%27/%3E%3Crect x=%273%27 y=%273%27 width=%2726%27 height=%2726%27 fill=%27none%27 stroke=%27%230DABE2%27 stroke-width=%271.5%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27%23F8D81B%27 font-family=%27serif%27%3E%D9%88%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/join.css">
</head>
<body>

<div class="join-wrap">
  <div class="join-card" id="form">
    <div class="join-kicker" id="kicker"></div>
    <h2>تسجيل الطالبة</h2>
    <label for="name">الاسم الكامل</label>
    <input type="text" id="name" autocomplete="name" placeholder="مثال: سارة أحمد المطيري">
    <label for="uid">الرقم الجامعي</label>
    <input type="text" id="uid" inputmode="numeric" autocomplete="off" placeholder="٢٠٢١٠٠١٢٣٤">
    <label for="section">الشعبة</label>
    <select id="section"></select>
    <button id="go" type="button">تسجيل</button>
    <p class="join-note">بياناتك تُحفظ على جهازك، ولا تُرسل تلقائيًا لأي مكان. الخطوة الأخيرة هي عرض الرمز على الدكتورة.</p>
  </div>

  <div class="join-card" id="done" hidden>
    <div class="join-kicker">تم التسجيل</div>
    <h2 id="who"></h2>
    <p class="join-note">اعرضي هذا الرمز على الدكتورة لتضيفك إلى الكشف.</p>
    <div class="qr-box small" id="qr"></div>
    <div class="row">
      <button id="dl" type="button" class="ghost">تنزيل ملف التسجيل</button>
      <button id="copy" type="button" class="ghost">نسخ رمز التسجيل</button>
      <a class="btn" id="mine" href="#">صفحتي</a>
    </div>
    <div class="code-line" id="code"></div>
    <button id="again" type="button" class="ghost sm">تسجيل طالبة أخرى على هذا الجهاز</button>
  </div>
</div>

<footer class="foot">
  <div id="credit"></div>
</footer>

<script src="data/course.js"></script>
<script src="data/worksheets.js"></script>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/qr.js"></script>
<script src="assets/join.js"></script>
</body>
</html>
